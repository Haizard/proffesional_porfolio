kind = "web"
previewPath = "/"
title = "Professional Portfolio"
version = "1.0.0"
id = "artifacts/professional-portfolio"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21834

[services.development]
run = "pnpm --filter @workspace/professional-portfolio run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/professional-portfolio", "run", "build" ]
run = "pnpm --filter @workspace/professional-portfolio run start"

[services.env]
PORT = "21834"
